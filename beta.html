<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tridib & Madhuri | Wedding Gallery</title>
    
    <!-- Elegant Serif Fonts for English and Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        /* Traditional Wedding Color Palette */
        :root {
            --bg-color: #fdfaf6;
            --text-main: #5c1a1b;
            --text-accent: #c48b36;
            --border-color: #e3d2c3;
        }
        
        body { font-family: 'Playfair Display', serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; scroll-behavior: smooth; }

        /* Bilingual Text Stacking styling */
        .bilingual { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .bilingual .bn { font-family: 'Tiro Bangla', serif; font-size: 0.9em; color: var(--text-accent); margin-top: 4px; }
        .bilingual .en { font-weight: 600; }

        /* Top Navigation */
        .top-nav { display: flex; justify-content: center; gap: 40px; padding: 15px; background: #fff; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .top-nav a { text-decoration: none; color: var(--text-main); }

        /* Header Area */
        header { text-align: center; padding: 50px 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 40px; background: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="%23e3d2c3"/></svg>'); }
        header h1 { font-size: 2.2rem; margin: 0 0 15px 0; color: var(--text-main); }
        header p { font-size: 1.2rem; margin: 0 0 10px 0; }
        header small { color: var(--text-accent); font-style: italic; }

        /* Photo Grid */
        section { max-width: 1200px; margin: 0 auto 70px auto; padding: 0 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .photo-card { background: #fff; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(92, 26, 27, 0.05); text-decoration: none; display: block; transition: transform 0.3s; cursor: pointer; }
        .photo-card:hover { transform: translateY(-5px); }
        .photo-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 2px; background-color: #f0e9e1; }

        /* Loading Text */
        #loading-text { text-align: center; grid-column: 1 / -1; padding: 40px; font-style: italic; color: var(--text-accent); font-size: 1.2rem; }

        /* Footer */
        footer { text-align: center; padding: 30px 20px 40px 20px; background: #fff; border-top: 1px solid var(--border-color); }

        /* Lightbox */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(253, 250, 246, 0.95); z-index: 999; justify-content: center; align-items: center; }
        #lightbox img { max-width: 90%; max-height: 85%; border-radius: 4px; border: 8px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: opacity 0.2s ease-in-out; }
        
        /* Lightbox Controls */
        .close-btn { position: absolute; top: 15px; right: 25px; color: var(--text-main); font-size: 40px; text-decoration: none; font-weight: bold; cursor: pointer; z-index: 1001; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); font-size: 40px; color: var(--text-main); background: rgba(255,255,255,0.7); border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; z-index: 1000; transition: 0.3s; }
        .nav-btn:hover { background: #fff; }
        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }
        
        .download-btn { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: var(--text-main); color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 25px; font-size: 0.9rem; font-family: 'Playfair Display', serif; display: flex; gap: 8px; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; z-index: 1001; }
        .download-btn:hover { background: var(--text-accent); }

        /* Back to Top Button */
        #back-to-top { display: none; position: fixed; bottom: 30px; right: 30px; background: var(--text-main); color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; z-index: 900; }
        #back-to-top:hover { background: var(--text-accent); transform: translateY(-3px); }

    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav" id="top">
        <a href="index.html" class="bilingual" style="border-bottom: 2px solid var(--text-accent);">
            <span class="en">Wedding</span>
            <span class="bn">বিবাহ</span>
        </a>
        <a href="reception.html" class="bilingual">
            <span class="en">Reception</span>
            <span class="bn">প্রীতিভোজ</span>
        </a>
    </nav>

    <!-- Header -->
    <header>
        <div class="bilingual">
            <h1 class="en">The Wedding</h1>
            <h1 class="bn">বিবাহ</h1>
        </div>
        <div class="bilingual">
            <p class="en">Tridib & Madhuri</p>
            <p class="bn">ত্রিদিব ও মাধুরী</p>
        </div>
        <div class="bilingual">
            <small class="en">[ 11 March, 2026 ]</small>
            <small class="bn">[ ১১ মার্চ, ২০২৬ ]</small>
        </div>
    </header>

    <!-- Gallery Section -->
    <section>
        <div class="gallery" id="gallery-container">
            <div id="loading-text">Loading memories...<br>স্মৃতিগুলো সাজানো হচ্ছে...</div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p class="bilingual">
            <span class="en">Limit plastic use, keep the Earth beautiful.</span>
            <span class="bn">প্লাস্টিকের ব্যবহার সীমিত করি, পৃথিবীকে সুন্দর রাখি</span>
        </p>
    </footer>

    <!-- Back to Top Button -->
    <button id="back-to-top" title="Go to top">↑</button>

    <!-- Lightbox Viewer -->
    <div id="lightbox">
        <span class="close-btn" onclick="closeLightbox()">&times;</span>
        <button class="nav-btn" id="prev-btn" onclick="changeImage(-1)">&#10094;</button>
        <img id="lb-img" src="" alt="Full size photo">
        <button class="nav-btn" id="next-btn" onclick="changeImage(1)">&#10095;</button>
        <a id="lb-download" class="download-btn" href="#" target="_blank" download>
            ↓ Download High-Res
        </a>
    </div>

    <!-- Script to dynamically load images & handle logic -->
    <script>
        const BASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbztuy887NVJTDNv8ue4vnxCTIq309FRNDfavJs1ghsWXiJtwDtCLorbqQPe5fK8sPqP/exec";
        const FOLDER_ID = "1fSvxSYul_MCC2F5stFCFMWzvjHQfhC-E"; 
        const API_URL = `${BASE_SCRIPT_URL}?folderId=${FOLDER_ID}`;

        let allImageIds = [];
        let currentIndex = 0; // Number of images rendered
        let currentLightboxIndex = 0; // Index of the currently viewed image in lightbox
        const BATCH_SIZE = 20;

        async function loadGallery() {
            try {
                const response = await fetch(API_URL);
                allImageIds = await response.json();
                
                document.getElementById('loading-text').style.display = 'none';
                
                const btnContainer = document.createElement('div');
                btnContainer.style.textAlign = 'center';
                btnContainer.style.marginTop = '30px';
                btnContainer.style.gridColumn = '1 / -1';
                
                const loadMoreBtn = document.createElement('button');
                loadMoreBtn.id = 'load-more-btn';
                loadMoreBtn.innerText = "Load More Photos";
                loadMoreBtn.style.padding = "10px 25px";
                loadMoreBtn.style.fontSize = "1rem";
                loadMoreBtn.style.backgroundColor = "var(--text-main)";
                loadMoreBtn.style.color = "#fff";
                loadMoreBtn.style.border = "none";
                loadMoreBtn.style.borderRadius = "5px";
                loadMoreBtn.style.cursor = "pointer";
                loadMoreBtn.style.fontFamily = "'Playfair Display', serif";
                
                loadMoreBtn.onclick = renderNextBatch;
                
                btnContainer.appendChild(loadMoreBtn);
                document.getElementById('gallery-container').after(btnContainer);

                renderNextBatch();

            } catch (error) {
                console.error("Error fetching images:", error);
                document.getElementById('loading-text').innerHTML = "Could not load images. Please try refreshing.<br>ছবিগুলি লোড করা যায়নি। অনুগ্রহ করে রিফ্রেশ করুন।";
            }
        }

        function renderNextBatch() {
            const container = document.getElementById('gallery-container');
            const nextIndex = Math.min(currentIndex + BATCH_SIZE, allImageIds.length);
            
            for (let i = currentIndex; i < nextIndex; i++) {
                const id = allImageIds[i];
                const a = document.createElement('a');
                a.href = "#";
                a.className = "photo-card";
                
                // Open lightbox on click passing the specific index
                a.onclick = (e) => {
                    e.preventDefault();
                    openLightbox(i);
                };

                const img = document.createElement('img');
                img.src = `https://drive.google.com/thumbnail?id=${id}&sz=w600`;
                img.alt = "Wedding Photo";
                img.loading = "lazy"; 

                a.appendChild(img);
                container.appendChild(a);
            }
            
            currentIndex = nextIndex;
            
            if (currentIndex >= allImageIds.length) {
                const loadMore = document.getElementById('load-more-btn');
                if(loadMore) loadMore.style.display = 'none';
            }
        }

        /* --- Lightbox Functionality --- */
        
        function openLightbox(index) {
            currentLightboxIndex = index;
            updateLightbox();
            document.getElementById('lightbox').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Prevent background scrolling
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = 'auto'; // Re-enable background scrolling
        }

        function changeImage(direction) {
            currentLightboxIndex += direction;
            
            // Loop back if out of bounds
            if (currentLightboxIndex < 0) currentLightboxIndex = allImageIds.length - 1;
            if (currentLightboxIndex >= allImageIds.length) currentLightboxIndex = 0;
            
            updateLightbox();
        }

        function updateLightbox() {
            const id = allImageIds[currentLightboxIndex];
            const lbImg = document.getElementById('lb-img');
            const lbDownload = document.getElementById('lb-download');
            
            // Add slight fade effect
            lbImg.style.opacity = '0.5';
            setTimeout(() => {
                lbImg.src = `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
                lbImg.style.opacity = '1';
            }, 150);
            
            // Set direct download link for Google Drive
            lbDownload.href = `https://drive.google.com/uc?export=download&id=${id}`;
        }

        /* Keyboard Navigation */
        document.addEventListener('keydown', function(event) {
            const lightbox = document.getElementById('lightbox');
            if (lightbox.style.display === 'flex') {
                if (event.key === "Escape") closeLightbox();
                if (event.key === "ArrowLeft") changeImage(-1);
                if (event.key === "ArrowRight") changeImage(1);
            }
        });

        /* --- Back to Top Functionality --- */
        const bttBtn = document.getElementById("back-to-top");
        
        window.onscroll = function() {
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                bttBtn.style.display = "block";
            } else {
                bttBtn.style.display = "none";
            }
        };

        bttBtn.onclick = function() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        window.onload = loadGallery;
    </script>
</body>
</html>
