<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tridib & Madhuri | Reception Gallery</title>
    
    <!-- Elegant Serif Fonts for English and Bengali -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        /* Traditional Wedding Color Palette */
        :root {
            --bg-color: #fdfaf6;
            --text-main: #5c1a1b;
            --text-accent: #c48b36;
            --border-color: #e3d2c3;
        }
        
        body { font-family: 'Playfair Display', serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; line-height: 1.6; }

        /* Bilingual Text Stacking styling */
        .bilingual { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .bilingual .bn { font-family: 'Tiro Bangla', serif; font-size: 0.9em; color: var(--text-accent); margin-top: 4px; }
        .bilingual .en { font-weight: 600; }

        /* Top Navigation */
        .top-nav { display: flex; justify-content: center; gap: 40px; padding: 15px; background: #fff; border-bottom: 1px solid var(--border-color); }
        .top-nav a { text-decoration: none; color: var(--text-main); }

        /* Header Area */
        header { text-align: center; padding: 50px 20px; border-bottom: 1px solid var(--border-color); margin-bottom: 40px; background: url('data:image/svg+xml;utf8,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="%23e3d2c3"/></svg>'); }
        header h1 { font-size: 2.2rem; margin: 0 0 15px 0; color: var(--text-main); }
        header p { font-size: 1.2rem; margin: 0 0 10px 0; }
        header small { color: var(--text-accent); font-style: italic; }

        /* Photo Grid */
        section { max-width: 1200px; margin: 0 auto 70px auto; padding: 0 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .photo-card { background: #fff; padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(92, 26, 27, 0.05); text-decoration: none; display: block; transition: transform 0.3s; cursor: pointer; }
        .photo-card:hover { transform: translateY(-5px); }
        .photo-card img { width: 100%; height: 250px; object-fit: cover; border-radius: 2px; background-color: #f0e9e1; }

        /* Loading Text */
        #loading-text { text-align: center; grid-column: 1 / -1; padding: 40px; font-style: italic; color: var(--text-accent); font-size: 1.2rem; }

        /* Footer */
        footer { text-align: center; padding: 30px 20px 40px 20px; background: #fff; border-top: 1px solid var(--border-color); }

        /* Lightbox */
        #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(253, 250, 246, 0.95); z-index: 999; justify-content: center; align-items: center; }
        #lightbox:target { display: flex; }
        #lightbox img { max-width: 90%; max-height: 85%; border-radius: 4px; border: 8px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .close-btn { position: absolute; top: 20px; right: 30px; color: var(--text-main); font-size: 45px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <a href="index.html" class="bilingual">
            <span class="en">Home</span>
            <span class="bn">নীড়পাতা</span>
        </a>
        <a href="#" class="bilingual" style="border-bottom: 2px solid var(--text-accent);">
            <span class="en">Reception</span>
            <span class="bn">প্রীতিভোজ</span>
        </a>
    </nav>

    <!-- Header -->
    <header>
        <div class="bilingual">
            <h1 class="en">The Reception</h1>
            <h1 class="bn">প্রীতিভোজ</h1>
        </div>
        <div class="bilingual">
            <p class="en">Tridib & Madhuri</p>
            <p class="bn">ত্রিদিব ও মাধুরী</p>
        </div>
    </header>

    <!-- Single Gallery Section (Dynamic) -->
    <section>
        <div class="gallery" id="gallery-container">
            <div id="loading-text">Loading memories...<br>স্মৃতিগুলো সাজানো হচ্ছে...</div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p class="bilingual">
            <span class="en">Limit plastic use, keep the Earth beautiful.</span>
            <span class="bn">প্লাস্টিকের ব্যবহার সীমিত করি, পৃথিবীকে সুন্দর রাখি</span>
        </p>
    </footer>

    <!-- Lightbox Viewer -->
    <div id="lightbox">
        <a href="#" class="close-btn">&times;</a>
        <img id="lb-img" src="" alt="Full size photo">
    </div>

    <!-- Script to dynamically load images in safe batches -->
    <script>
        // 1. Your NEW Master API URL
        const BASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbztuy887NVJTDNv8ue4vnxCTIq309FRNDfavJs1ghsWXiJtwDtCLorbqQPe5fK8sPqP/exec";
        
        // 2. The ID extracted from the Reception Google Drive link
        const FOLDER_ID = "1WSnKMKyt9jGWVA9lZ25MBPkthN1cN9Pd"; 
        
        // 3. Combine them to tell the API to look in the new folder
        const API_URL = `${BASE_SCRIPT_URL}?folderId=${FOLDER_ID}`;

        let allImageIds = [];
        let currentIndex = 0;
        const BATCH_SIZE = 20; // How many to load at once

        async function loadGallery() {
            try {
                const response = await fetch(API_URL);
                allImageIds = await response.json();
                
                document.getElementById('loading-text').style.display = 'none';
                
                // Add the Load More button to the page
                const btnContainer = document.createElement('div');
                btnContainer.style.textAlign = 'center';
                btnContainer.style.marginTop = '30px';
                btnContainer.style.gridColumn = '1 / -1';
                
                const loadMoreBtn = document.createElement('button');
                loadMoreBtn.innerText = "Load More Photos";
                loadMoreBtn.style.padding = "10px 25px";
                loadMoreBtn.style.fontSize = "1rem";
                loadMoreBtn.style.backgroundColor = "var(--text-main)";
                loadMoreBtn.style.color = "#fff";
                loadMoreBtn.style.border = "none";
                loadMoreBtn.style.borderRadius = "5px";
                loadMoreBtn.style.cursor = "pointer";
                loadMoreBtn.style.fontFamily = "'Playfair Display', serif";
                
                loadMoreBtn.onclick = renderNextBatch;
                
                btnContainer.appendChild(loadMoreBtn);
                document.getElementById('gallery-container').after(btnContainer);

                // Load the first batch immediately
                renderNextBatch();

            } catch (error) {
                console.error("Error fetching images:", error);
                document.getElementById('loading-text').innerHTML = "Could not load images. Please try refreshing.<br>ছবিগুলি লোড করা যায়নি। অনুগ্রহ করে রিফ্রেশ করুন।";
            }
        }

        function renderNextBatch() {
            const container = document.getElementById('gallery-container');
            
            // Determine how many to load this round
            const nextIndex = Math.min(currentIndex + BATCH_SIZE, allImageIds.length);
            
            for (let i = currentIndex; i < nextIndex; i++) {
                const id = allImageIds[i];
                
                const a = document.createElement('a');
                a.href = "#lightbox";
                a.className = "photo-card";
                a.onclick = () => {
                    document.getElementById('lb-img').src = `https://drive.google.com/thumbnail?id=${id}&sz=w1000`;
                };

                const img = document.createElement('img');
                img.src = `https://drive.google.com/thumbnail?id=${id}&sz=w600`;
                img.alt = "Wedding Photo";
                img.loading = "lazy"; 

                a.appendChild(img);
                container.appendChild(a);
            }
            
            currentIndex = nextIndex;
            
            // Hide the button if we've loaded everything
            if (currentIndex >= allImageIds.length) {
                document.querySelector('button').style.display = 'none';
            }
        }

        window.onload = loadGallery;
    </script>
</body>
</html>
